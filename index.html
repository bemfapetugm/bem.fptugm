<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>BEM Fapet UGM | Official Website</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- Reset Margin & Padding Dasar --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        /* --- Penyimpanan Variabel Warna Website --- */
        :root {
            --secondary: #FFC107;  /* Warna Kuning Emas khas UGM */
            --dark: #1A1A1A;       /* Warna teks utama (hitam elegan) */
            --white: #FFFFFF;      /* Warna putih murni */
            --light-bg: #F9FBF9;   /* Warna latar belakang halaman (putih tulang soft) */
        }

        /* --- Pengaturan Tampilan Body Halaman --- */
        body {
            background-color: var(--light-bg);
            color: var(--dark);
            line-height: 1.6;
        }

        /* --- Desain Kontainer Atas (Header Kaca) --- */
        header {
            background-color: rgba(58, 58, 58, 0.65); /* Warna abu transparan */
            backdrop-filter: blur(10px);             /* Efek blur/frosted glass */
            -webkit-backdrop-filter: blur(10px);     
            position: fixed;                         /* Membuat header melayang permanen di atas */
            width: 100%;
            top: 0;
            z-index: 1000;                           /* Memastikan header tidak tertimbun konten lain */
            border-bottom: 1px solid rgba(255, 255, 255, 0.1); 
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        /* --- Tata Letak Menu Navigasi (Navbar) --- */
        .navbar {
            display: flex;
            justify-content: space-between;          /* Logo di kiri, menu di kanan */
            align-items: center;
            padding: 1.2rem 8%;
        }

        /* --- Desain Teks Logo --- */
        .navbar .logo {
            color: var(--white);
            font-weight: 700;
            font-size: 1.5rem;
            text-decoration: none;
            letter-spacing: 0.5px;
        }

        /* --- Warna Aksen Emas untuk Kata 'UGM' --- */
        .navbar .logo span {
            color: var(--secondary);
        }

        /* --- Desain Baris Menu Tautan --- */
        .nav-links {
            display: flex;
            list-style: none;                        /* Menghilangkan tanda bullet bulat default */
        }

        /* --- Jarak Antar Menu Tautan --- */
        .nav-links li {
            margin-left: 2.5rem;
        }

        /* --- Desain Teks Link Menu --- */
        .nav-links a {
            color: rgba(255, 255, 255, 0.85);
            text-decoration: none;                  /* Menghilangkan garis bawah default pada link */
            font-weight: 400;
            font-size: 1rem;
            transition: color 0.3s ease;            /* Animasi halus saat warna berubah */
        }

        /* --- Efek Ketika Kursor Menyentuh Menu --- */
        .nav-links a:hover {
            color: var(--secondary);
        }

        /* --- Desain Konten Utama Area Tengah --- */
        main {
            padding: 8rem 8% 5rem;                   /* padding-top 8rem agar teks tidak tertutup header */
            text-align: center;
            max-width: 800px;
            margin: 0 auto;                          /* Membuat kontainer otomatis di tengah layar */
        }

        /* --- Jarak Bawah untuk Judul Selamat Datang --- */
        main h1 {
            margin-bottom: 1rem;
        }

        /* --- Aturan Khusus Layran HP (Mobile Responsive) --- */
        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;              /* Susun vertikal jika layar kekecilan */
                gap: 1rem;
            }
            .nav-links li {
                margin: 0 1rem;
            }
            main h1 {
                font-size: 2rem;                     /* Ukuran judul mengecil di HP */
            }
        }
    </style>
</head>
<body>

    <header>
        <nav class="navbar">
            <a href="#" class="logo">BEM FAPET <span>UGM</span></a>
            
            <ul class="nav-links">
                <li><a href="#">Beranda</a></li>
                <li><a href="#">Profil</a></li>
                <li><a href="#">Kementerian</a></li>
                <li><a href="#">Aspirasi</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1>Selamat Datang di Website Resmi BEM Fapet UGM</h1>
        <p>Temukan informasi terbaru tentang kegiatan, program, dan berita seputar BEM Fapet UGM di sini.</p>
    </main>
    </body>
</html>
